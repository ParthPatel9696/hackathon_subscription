<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">Brightloop — subscription operations, in good order</title>
  <desc id="description">Brightloop branding on a warm neutral background, with a connected quotation, subscription, invoice and payment workflow.</desc>
  <rect width="1280" height="440" rx="16" fill="#f4f6f1"/>
  <path d="M760 0V440" stroke="#dce3da"/>
  <rect x="56" y="48" width="42" height="42" rx="10" fill="#173c35"/>
  <text x="69" y="78" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">b</text>
  <text x="110" y="77" fill="#173c35" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-1">brightloop</text>
  <text x="57" y="143" fill="#167d6b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">SUBSCRIPTION OPERATIONS</text>
  <g fill="#202e28" font-family="Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-2.4">
    <text x="54" y="213">Every subscription.</text>
    <text x="54" y="276">One clear picture.</text>
  </g>
  <text x="57" y="322" fill="#627269" font-family="Arial,sans-serif" font-size="18">From the first quotation to the final payment.</text>
  <path d="M57 357H704" stroke="#dce3da"/>
  <text x="57" y="392" fill="#627269" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4">MERN STACK</text>
  <circle cx="174" cy="388" r="2" fill="#167d6b"/>
  <text x="188" y="392" fill="#627269" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4">INR FIRST</text>
  <circle cx="290" cy="388" r="2" fill="#167d6b"/>
  <text x="304" y="392" fill="#627269" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4">THREE CONNECTED WORKSPACES</text>
  <g font-family="Arial,sans-serif">
    <text x="807" y="76" fill="#627269" font-size="11" font-weight="700" letter-spacing="2">THE RECURRING REVENUE LOOP</text>
    <path d="M831 119V332" stroke="#c7d6cb" stroke-width="2"/>
    <g fill="#ffffff" stroke="#d8e2d8">
      <rect x="806" y="100" width="417" height="60" rx="7"/>
      <rect x="806" y="174" width="417" height="60" rx="7"/>
      <rect x="806" y="248" width="417" height="60" rx="7"/>
      <rect x="806" y="322" width="417" height="60" rx="7"/>
    </g>
    <g fill="#e8f3ed">
      <circle cx="831" cy="130" r="12"/>
      <circle cx="831" cy="204" r="12"/>
      <circle cx="831" cy="278" r="12"/>
      <circle cx="831" cy="352" r="12"/>
    </g>
    <g fill="#167d6b" font-size="10" font-weight="700" text-anchor="middle">
      <text x="831" y="134">01</text><text x="831" y="208">02</text>
      <text x="831" y="282">03</text><text x="831" y="356">04</text>
    </g>
    <g fill="#25382e" font-size="15" font-weight="700">
      <text x="856" y="126">Prepare the quotation</text><text x="856" y="200">Activate the subscription</text>
      <text x="856" y="274">Generate the invoice</text><text x="856" y="348">Record the payment</text>
    </g>
    <g fill="#738177" font-size="11">
      <text x="856" y="144">Products, variants and reusable templates</text>
      <text x="856" y="218">Plans, permissions and billing schedules</text>
      <text x="856" y="292">Price snapshots and visible balances</text>
      <text x="856" y="366">Partial payments, settlement and reporting</text>
    </g>
  </g>
